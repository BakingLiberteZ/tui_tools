name: Python Application

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v6

    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Resolve lockfile
      run: |
        uv lock

    - name: Install dependencies
      run: |
        uv sync --dev --frozen

    - name: Dependency policy gate
      run: |
        python scripts/check_dependency_policy.py

    - name: Lint (ruff)
      run: |
        uv run ruff check sassy_wallet tests

    - name: Format check (ruff)
      run: |
        uv run ruff format --check sassy_wallet tests

    - name: Type check (ty)
      run: |
        uv run ty check

    - name: Run tests
      run: |
        uv run pytest tests/ -v --cov=sassy_wallet --cov-report=term-missing

    - name: Check imports
      run: |
        uv run python -c "import sassy_wallet; print(f'Version: {sassy_wallet.__version__}')"
